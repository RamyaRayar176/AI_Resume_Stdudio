<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting...</title>
    <script>
      // Redirect Live Server (port 5500) or other static server preview ports to the running Flask app (port 5000)
      if (window.location.port && window.location.port !== "5000" && window.location.port !== "3000") {
          window.location.href = "http://localhost:5000";
      } else {
          // If loaded directly from port 5000 or file:// protocol, fallback to standard redirect
          window.location.href = "http://localhost:5000";
      }
    </script>
  </head>
  <body>
    <p>Redirecting to Placement AI Studio on <a href="http://localhost:5000">http://localhost:5000</a>...</p>
  </body>
</html>
